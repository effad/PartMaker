plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

version = '0.1.1'

repositories {
    mavenCentral()
}

dependencies {

    // Testing dependencies - aligned JUnit 5 version + mandatory launcher
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2' // Fixes the Gradle 9 error

    testImplementation 'org.testfx:testfx-junit5:4.0.17'
    testImplementation 'org.testfx:openjfx-monocle:jdk-12.0.1+2'
    
    // Utility libraries
    implementation 'com.google.guava:guava:29.0-jre'
    implementation 'commons-io:commons-io:2.8.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    
    // Jackson is used to deserialize .json file into POJOs 
    implementation 'com.fasterxml.jackson.core:jackson-core:2.12.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.12.2'
    
    // Groovy is used for scripts that generate parts    
    implementation 'org.codehaus.groovy:groovy:3.0.7'
    
    // ValidatorFX is used for parameter validation
    implementation 'net.synedra:validatorfx:1.0.0'
    
    // RichTextFX is used for source code editing
    implementation 'org.fxmisc.richtext:richtextfx:0.11.7'
    
    // Ikonli provides nice icons
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.2.0'
    implementation 'org.kordamp.ikonli:ikonli-feather-pack:12.2.0'
    
    // Local JDXF jar
    implementation fileTree(include: ['*.jar'], dir: 'libs')    
}
javafx {
    version = "25"
    modules = [ 'javafx.controls', 'javafx.graphics', 'javafx.base' ]
}

// Points to your main class for running via ./gradlew run
application {
    mainClass = 'org.partmaker.PartMaker' // Replace with your actual Main class
}

test {
    useJUnitPlatform()
    jvmArgs '-Djava.awt.headless=true', '-Dtestfx.robot=glass', '-Dtestfx.headless=true', '-Dprism.order=sw'
}

jar {
    manifest {
        attributes(
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        )
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}